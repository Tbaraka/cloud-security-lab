apiVersion: v1
kind: Pod
metadata:
  name: kali-test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: kali
      image: cloudsec-lab2-kali:latest
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]

      securityContext:
        allowPrivilegeEscalation: true
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        capabilities:
          add:
           - NET_RAW
           - NET_ADMIN

      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"

  restartPolicy: Never