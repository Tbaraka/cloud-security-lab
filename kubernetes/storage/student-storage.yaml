apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: student-work-pvc
  namespace: student-lab-1
  labels:
    lab: cloudsec
    purpose: student-work
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: student-secrets
  namespace: student-lab-1
type: Opaque
stringData:
  lab-notes: "Encrypted-at-rest-via-etcd; production would use KMS-backed disk encryption"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-work
  namespace: student-lab-1
  labels:
    app: student-work
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-work
  template:
    metadata:
      labels:
        app: student-work
    spec:
      containers:
        - name: work
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "Student lab notes $(date)" > /work/session.txt
              echo "secret mounted" > /secrets/status.txt
              ls -la /work /secrets
              sleep infinity
          volumeMounts:
            - name: work
              mountPath: /work
            - name: secrets
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: student-work-pvc
        - name: secrets
          secret:
            secretName: student-secrets
