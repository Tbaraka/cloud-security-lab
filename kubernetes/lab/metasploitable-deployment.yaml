apiVersion: apps/v1
kind: Deployment
metadata:
  name: metasploitable-lab
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metasploitable-lab
  template:
    metadata:
      labels:
        app: metasploitable-lab
    spec:
      containers:
      - name: metasploitable
        image: metasploitable-lab:latest
        ports:
        - containerPort: 22
        - containerPort: 4444
---
apiVersion: v1
kind: Service
metadata:
  name: metasploitable-lab
spec:
  type: NodePort
  selector:
    app: metasploitable-lab
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      nodePort: 30023
    - name: msf
      port: 4444
      targetPort: 4444
      nodePort: 30444