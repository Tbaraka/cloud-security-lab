apiVersion: v1
kind: ServiceAccount
metadata:
  name: student-${STUDENT_ID}
  namespace: student-${STUDENT_ID}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: student-role
  namespace: student-${STUDENT_ID}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: student-${STUDENT_ID}-binding
  namespace: student-${STUDENT_ID}
subjects:
  - kind: ServiceAccount
    name: student-${STUDENT_ID}
    namespace: student-${STUDENT_ID}
roleRef:
  kind: Role
  name: student-role
  apiGroup: rbac.authorization.k8s.io