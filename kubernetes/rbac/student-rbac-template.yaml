apiVersion: v1
kind: ServiceAccount
metadata:
  name: student-${STUDENT_ID}
  namespace: student-${STUDENT_ID}
  labels:
    lab: cloudsec
    student-id: "${STUDENT_ID}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: student-role
  namespace: student-${STUDENT_ID}
  labels:
    lab: cloudsec
    student-id: "${STUDENT_ID}"
rules:
  # Pods: view, create, delete own lab workloads
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Exec: required for lab exercises (attacker/target interaction)
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Logs: view pod output for debugging
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  # Services: view only (no create/delete cluster networking)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: student-${STUDENT_ID}-binding
  namespace: student-${STUDENT_ID}
  labels:
    lab: cloudsec
    student-id: "${STUDENT_ID}"
subjects:
  - kind: ServiceAccount
    name: student-${STUDENT_ID}
    namespace: student-${STUDENT_ID}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: student-role