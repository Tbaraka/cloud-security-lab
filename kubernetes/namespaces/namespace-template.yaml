apiVersion: v1
kind: Namespace
metadata:
  name: ${STUDENT_ID}
  labels:
    lab: cloudsec
    student-id: ${STUDENT_ID}
    environment: training
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: student-quota
  namespace: ${STUDENT_ID}
spec:
  hard:
    requests.cpu: "1"
    limits.cpu: "2"
    requests.memory: 1Gi
    limits.memory: 2Gi
    pods: "5"
