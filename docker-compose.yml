version: '3.8'

services:
  kali:
    image: kali-lab:latest
    container_name: kali-lab
    privileged: true
    ports:
      - "2222:22"
    networks:
      - sec-lab

  metasploitable:
    image: metasploitable-lab:latest
    container_name: metasploitable-lab
    ports:
      - "2223:22"
      - "4444:4444"
    networks:
      - sec-lab

networks:
  sec-lab:
    driver: bridge