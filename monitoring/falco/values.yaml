# Falco values for Kind (cybersecurity multi-tenant lab)
tty: true

driver:
  kind: modern_ebpf

falco:
  json_output: true
  json_include_output_property: true
  log_level: info
  priority: debug
  buffered_outputs: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

falcosidekick:
  enabled: false

# Custom rules for the cybersecurity training lab
customRules:
  cyber-lab.yaml: |-
    - rule: Cyber Lab Suspicious Activity
      desc: Detects reconnaissance tools or sensitive file access in student lab pods
      condition: >
        (spawned_process and container and
         (proc.name in (nmap, nc, netcat, curl, wget, bash, sh) or
          proc.cmdline contains "nmap"))
      output: >
        CyberLab alert (user=%user.name command=%proc.cmdline container=%container.name
        pod=%k8s.pod.name ns=%k8s.ns.name image=%container.image.repository)
      priority: WARNING
      tags: [cyberlab, network, mitre_discovery]

    - rule: Cyber Lab Read Shadow
      desc: Detect attempt to read /etc/shadow inside a container
      condition: >
        open_read and container and fd.name=/etc/shadow
      output: >
        CyberLab sensitive file read (user=%user.name file=%fd.name command=%proc.cmdline
        pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: WARNING
      tags: [cyberlab, filesystem, mitre_credential_access]
